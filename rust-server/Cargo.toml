[package]
name = "luminus-server"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "luminus-server"
path = "src/server.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "bigdecimal"] }
minijinja = { version = "2", features = ["loader", "json", "builtins"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
pbkdf2 = "0.12"
rand = "0.8"
argon2 = "0.5"
subtle = "2"
sha1 = "0.10"
bigdecimal = "0.4"
multer = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
arc-swap = "1"
ammonia = "4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_Security"] }
maxminddb = "0.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
