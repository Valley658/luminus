worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 2048; }
http {
 include mime.types;
 default_type application/octet-stream;
 server_tokens off;
 access_log off;
 sendfile on;
 keepalive_timeout 30;
 client_max_body_size 8m;
 etag on;
 open_file_cache off;
 open_file_cache_valid 5s;
 gzip on;
 gzip_vary on;
 gzip_min_length 512;
 gzip_comp_level 5;
 gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
 map "$http_cf_ray$http_cf_connecting_ip$http_x_forwarded_for$http_x_forwarded_proto$http_forwarded" $proxied_request { "" 0; default 1; }
 server {
  listen 127.0.0.1:80 default_server;
  server_name _;
  return 404;
 }
 server {
  listen 127.0.0.1:80;
  server_name pastellive.co.kr localhost 127.0.0.1;
  root ../../public;
  charset utf-8;
  error_page 404 /not-found.html;
  location = /not-found.html { internal; add_header Cache-Control "no-store"; }
  add_header X-Content-Type-Options nosniff always;
  location = /favicon.ico { expires 1d; add_header Cache-Control "public"; }
  location = /__nginx_health { return 204; }
  location = / {
   proxy_pass http://127.0.0.1:8081;
   proxy_set_header Host $http_host;
   proxy_set_header Connection "";
   proxy_http_version 1.1;
   proxy_hide_header Server;
   proxy_cache off;
  }
  location = /index.html {
   proxy_pass http://127.0.0.1:8081;
   proxy_set_header Host $http_host;
   proxy_set_header Connection "";
   proxy_http_version 1.1;
   proxy_hide_header Server;
   proxy_cache off;
  }
  location = /media/sweetalert2.all.min.js { expires 7d; add_header Cache-Control "public"; }
  location ~ ^/media/(stars-horizontal|stars-vertical)\.(gif|png)$ {
   expires 7d;
   add_header Cache-Control "public";
  }
  location = /index2.html {
   proxy_pass http://127.0.0.1:8081;
   proxy_set_header Host $http_host;
   proxy_set_header Connection "";
   proxy_hide_header Server;
  }
  location ~ "^/(watch(?:/[A-Za-z0-9_-]{11,200})?|schedule|history|bookmarks|playlists|gallery|highlights|mypage|profile|comments|privacy|terms|credits|updates|code|reports|reset-password|sw\.js|robots\.txt|sitemap\.xml|admin/stats)$" {
   proxy_pass http://127.0.0.1:8081;
   proxy_set_header Host $http_host;
   proxy_set_header Connection "";
   proxy_hide_header Server;
   add_header Cache-Control "private, no-store" always;
  }
  location ~ ^/(assets/|profiles/) {
   proxy_pass http://127.0.0.1:8081;
   proxy_set_header Host $http_host;
   proxy_set_header Connection "";
   proxy_http_version 1.1;
   proxy_hide_header Server;
  }
  # Imported UI assets and APIs remain subject to Python's path, host, session
  # and administrator checks. Never serve workspace directories directly.
  location ~ ^/(static/|api/|channel/|share/|login/discord(?:/|$)|account/verify-email$) {
   proxy_pass http://127.0.0.1:8081;
   proxy_set_header Host $http_host;
   proxy_set_header Connection "";
   proxy_http_version 1.1;
   proxy_read_timeout 40s;
   proxy_hide_header Server;
   proxy_cache off;
  }
  location ~ ^/api/(videos|shorts|site/revive)$ {
   proxy_pass http://127.0.0.1:8081;
   proxy_set_header Host $http_host;
   proxy_set_header Connection "";
   proxy_http_version 1.1;
   proxy_hide_header Server;
   add_header Cache-Control "private, no-store" always;
  }
  location ~ ^/(api/auth/|api/comments(?:/|$)|api/library(?:/|$)|auth/discord/) {
   proxy_pass http://127.0.0.1:8081;
   proxy_set_header Host $http_host;
   proxy_set_header Connection "";
   proxy_http_version 1.1;
   proxy_read_timeout 40s;
   proxy_hide_header Server;
   add_header Cache-Control "no-store" always;
  }
  location / { return 404; }
 }
 server {
  listen 127.0.0.1:80;
  server_name admin.pastellive.co.kr;
  client_max_body_size 16k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control "private, no-store" always;
  location / {
   proxy_pass http://127.0.0.1:8081;
   proxy_set_header Host $http_host;
   proxy_set_header Connection "";
   proxy_http_version 1.1;
   proxy_hide_header Server;
   proxy_cache off;
  }
 }
}
