<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하이라이트 클립 - 루미너스</title>
    <link rel="icon" href="{{ url_for('static', filename='logo/logo.webp') }}" type="image/webp">
    <meta name="theme-color" content="#0f0f0f">
    <link rel="canonical" href="https://pastellive.co.kr{{ request.path }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></noscript>

    
    <link rel="stylesheet" href="{{ versioned_static('css/watch.css') }}">

    <style>
        * { box-sizing: border-box; }
        body { align-items: stretch; }
        .hl-page { width: 100%; max-width: 1400px; margin: 96px auto 0; padding: 0 32px 40px; }
        .page-title { padding: 8px 0 4px; }
        .page-title h1 { margin: 0 0 6px; font-size: 24px; font-weight: 800; color: #fff; }
        .page-title p { margin: 0; color: #999; font-size: 13.5px; }

        .member-filter { display: flex; gap: 8px; flex-wrap: wrap; padding: 18px 0; }
        .member-filter button { display: flex; align-items: center; gap: 6px; background: #1a1a1a; color: #ccc; border: 1px solid #303030; border-radius: 20px; padding: 5px 14px 5px 6px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .member-filter button.member-all { padding: 6px 16px; }
        .member-filter button .filter-avatar { width: 24px; height: 24px; border-radius: 50%; background-size: cover; background-position: center; flex-shrink: 0; }
        .member-filter button.active { background: #38bdf8; color: #000; border-color: #38bdf8; }
        .member-filter button:hover { border-color: #555; }

        .clip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; padding: 8px 0 40px; }
        .clip-card { background: #1a1a1a; border: 1px solid #262626; border-radius: 14px; overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s; }
        .clip-card:hover { border-color: #38bdf8; transform: translateY(-3px); }
        .clip-thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
        .clip-thumb-wrap img.clip-gif { width: 100%; height: 100%; object-fit: cover; display: block; }
        .clip-scrub-layer { position: absolute; inset: 0; background-repeat: no-repeat; background-position: 0 0; opacity: 0; transition: opacity .1s; pointer-events: none; }
        .clip-thumb-wrap.scrub-active .clip-scrub-layer { opacity: 1; }
        .clip-duration-badge { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
        .clip-play-badge { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s; background: rgba(0,0,0,.25); }
        .clip-card:hover .clip-play-badge { opacity: 1; }
        .clip-play-badge i { font-size: 34px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
        .clip-info { padding: 12px 14px 14px; display: flex; gap: 10px; }
        .clip-member-avatar { width: 32px; height: 32px; border-radius: 50%; background-size: cover; background-position: center; background-color: #333; flex-shrink: 0; margin-top: 2px; }
        .clip-text-area { min-width: 0; flex: 1; }
        .clip-tag { font-size: 14.5px; font-weight: 700; color: #fff; margin: 0 0 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .clip-meta { font-size: 12px; color: #888; margin: 0; }

        .empty-state { padding: 70px 20px; text-align: center; color: #777; font-size: 14px; }
        .load-more-wrap { display: flex; justify-content: center; padding: 10px 0 40px; }
        .load-more-wrap button { background: #1a1a1a; color: #ccc; border: 1px solid #333; border-radius: 10px; padding: 10px 22px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; }
        .load-more-wrap button:hover { color: #fff; border-color: #555; }

        
        #clipLightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 20050; align-items: center; justify-content: center; padding: 20px; }
        #clipLightbox.open { display: flex; }
        .lightbox-inner { max-width: 480px; width: 100%; background: #141414; border-radius: 14px; overflow: hidden; border: 1px solid #2a2a2a; }
        .lightbox-inner video { width: 100%; display: block; background: #000; }
        .lightbox-close { text-align: right; padding: 8px 10px; }
        .lightbox-close button { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
        .lightbox-info { padding: 4px 18px 20px; display: flex; align-items: center; gap: 12px; }
        .lightbox-avatar { width: 36px; height: 36px; border-radius: 50%; background-size: cover; background-position: center; background-color: #333; flex-shrink: 0; }
        .lightbox-info h3 { margin: 0 0 4px; font-size: 15px; color: #fff; }
        .lightbox-info a { color: #38bdf8; font-size: 12px; text-decoration: none; }

        @media (max-width: 700px) { .hl-page { padding: 0 16px 40px; } }
    </style>
<script src="{{ versioned_static('js/thumbnails.js') }}"></script>
</head>
<body>
    <header class="header">
        <div class="logo-section" onclick="location.href='/'">
            <div class="logo-wrapper">
                <img src="{{ url_for('static', filename='logo/logo.webp') }}" alt="Logo" class="circle-logo">
            </div>
            <span class="site-name">루미너스</span>
        </div>
    </header>

    <div class="hl-page">
        <div class="page-title">
            <h1><i class="fas fa-scissors" style="color:#f472b6;"></i> 하이라이트 클립</h1>
            <p>시청자들이 태그한 순간들을 자동으로 잘라 모은 클립 모음이에요.</p>
        </div>

        <div class="member-filter" id="memberFilter">
            <button class="active member-all" data-member=""><i class="fas fa-layer-group"></i> 전체</button>
            {% for m in sidebar_members %}
            <button data-member="{{ m.name }}"><span class="filter-avatar" style="background-image:url('{{ m.img }}');"></span>{{ m.name }}</button>
            {% endfor %}
        </div>

        <div class="clip-grid" id="clipGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;">아직 만들어진 하이라이트 클립이 없어요. 영상 시청 페이지에서 '하이라이트 태그'로 첫 클립을 만들어보세요!</div>
        <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
            <button id="btnLoadMore">더 보기</button>
        </div>
    </div>

    <div id="clipLightbox">
        <div class="lightbox-inner">
            <div class="lightbox-close"><button onclick="closeClipLightbox()"><i class="fas fa-xmark"></i></button></div>
            <video id="lightboxVideo" controls playsinline></video>
            <div class="lightbox-info">
                <div class="lightbox-avatar" id="lightboxAvatar"></div>
                <div>
                    <h3 id="lightboxTag"></h3>
                    <a id="lightboxSourceLink" href="#" target="_blank" rel="noopener">원본 영상 보러가기 <i class="fas fa-arrow-up-right-from-square"></i></a>
                </div>
            </div>
        </div>
    </div>

    <script>const MEMBER_AVATARS = {{ (sidebar_members | tojson) if sidebar_members else '[]' }}.reduce((acc, m) => {
    acc[m.name] = m.img;
    return acc;
}, {});

let currentMemberFilter = "";

let currentOffset = 0;

const PAGE_SIZE = 24;

function formatClock(totalSeconds) {
    const s = Math.max(0, Math.floor(totalSeconds || 0));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

function escapeHtml(text) {
    return String(text == null ? "" : text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function resolveAssetUrl(path) {
    if (!path) return "";
    return `/static/${path}`;
}

function createClipCard(clip) {
    const card = document.createElement("div");
    card.className = "clip-card";
    const gifUrl = resolveAssetUrl(clip.gif_path);
    const avatarUrl = MEMBER_AVATARS[clip.member_name] || "";
    card.innerHTML = `\n                <div class="clip-thumb-wrap">\n                    ${gifUrl ? `<img class="clip-gif" src="${gifUrl}" loading="lazy" alt="${escapeHtml(clip.tag_text)}">` : ""}\n                    <div class="clip-scrub-layer"></div>\n                    <div class="clip-play-badge"><i class="fas fa-circle-play"></i></div>\n                    <span class="clip-duration-badge">${clip.duration_seconds}초</span>\n                </div>\n                <div class="clip-info">\n                    <div class="clip-member-avatar" style="background-image:url('${avatarUrl}');"></div>\n                    <div class="clip-text-area">\n                        <p class="clip-tag">${escapeHtml(clip.tag_text)}</p>\n                        <p class="clip-meta">${escapeHtml(clip.member_name || "")} · ${formatClock(clip.start_seconds)}부터${clip.nickname ? " · " + escapeHtml(clip.nickname) : ""}</p>\n                    </div>\n                </div>\n            `;
    card.onclick = () => openClipLightbox(clip);
    setupScrubPreview(card.querySelector(".clip-thumb-wrap"), clip);
    return card;
}

function setupScrubPreview(wrap, clip) {
    if (!wrap || !clip.sprite_path || !clip.sprite_frame_count || clip.sprite_frame_count < 2) return;
    const spriteUrl = resolveAssetUrl(clip.sprite_path);
    const frameCount = clip.sprite_frame_count;
    const layer = wrap.querySelector(".clip-scrub-layer");
    layer.style.backgroundImage = `url('${spriteUrl}')`;
    layer.style.backgroundSize = `${frameCount * 100}% 100%`;

    wrap.addEventListener("mouseenter", () => wrap.classList.add("scrub-active"));
    wrap.addEventListener("mouseleave", () => wrap.classList.remove("scrub-active"));
    wrap.addEventListener("mousemove", e => {
        const rect = wrap.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        const frameIndex = Math.min(frameCount - 1, Math.floor(ratio * frameCount));
        const positionPercent = (100 * frameIndex) / (frameCount - 1);
        layer.style.backgroundPositionX = `${positionPercent}%`;
    });
}

function openClipLightbox(clip) {
    const video = document.getElementById("lightboxVideo");
    video.src = resolveAssetUrl(clip.clip_path);
    document.getElementById("lightboxTag").textContent = clip.tag_text;
    document.getElementById("lightboxAvatar").style.backgroundImage = `url('${MEMBER_AVATARS[clip.member_name] || ""}')`;
    const link = document.getElementById("lightboxSourceLink");
    link.href = `/watch/${clip.source_video_id}?t=${clip.start_seconds}`;
    document.getElementById("clipLightbox").classList.add("open");
    video.play().catch(() => {});
}

function closeClipLightbox() {
    const video = document.getElementById("lightboxVideo");
    video.pause();
    video.src = "";
    document.getElementById("clipLightbox").classList.remove("open");
}

document.getElementById("clipLightbox").addEventListener("click", e => {
    if (e.target.id === "clipLightbox") closeClipLightbox();
});

async function loadClips(append) {
    const grid = document.getElementById("clipGrid");
    const emptyState = document.getElementById("emptyState");
    const loadMoreWrap = document.getElementById("loadMoreWrap");
    if (!append) {
        currentOffset = 0;
        grid.innerHTML = "";
    }
    let url = `/api/highlights?limit=${PAGE_SIZE}&offset=${currentOffset}`;
    if (currentMemberFilter) url += `&member=${encodeURIComponent(currentMemberFilter)}`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        const clips = data.clips || [];
        clips.forEach(clip => grid.appendChild(createClipCard(clip)));
        currentOffset += clips.length;
        loadMoreWrap.style.display = clips.length >= PAGE_SIZE ? "flex" : "none";
        if (currentOffset === 0 && clips.length === 0) {
            emptyState.textContent = currentMemberFilter ? `${currentMemberFilter} 채널의 하이라이트는 아직 없어요.` : "아직 만들어진 하이라이트 클립이 없어요. 영상 시청 페이지에서 '하이라이트 태그'로 첫 클립을 만들어보세요!";
            emptyState.style.display = "block";
        } else {
            emptyState.style.display = "none";
        }
    } catch (e) {
        console.error("하이라이트 목록을 불러오지 못했습니다", e);
    }
}

document.getElementById("memberFilter").addEventListener("click", e => {
    const btn = e.target.closest("button[data-member]");
    if (!btn) return;
    document.querySelectorAll("#memberFilter button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMemberFilter = btn.dataset.member || "";
    loadClips(false);
});

document.getElementById("btnLoadMore").addEventListener("click", () => loadClips(true));

loadClips(false);</script>
</body>
</html>
