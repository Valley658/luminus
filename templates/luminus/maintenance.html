<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>루미너스 · 점검 중</title><style>body{background:#101015;color:#eee;font:17px system-ui;max-width:560px;margin:12vh auto;padding:24px}input,button{display:block;box-sizing:border-box;width:100%;margin:12px 0;padding:12px;border-radius:8px}input{background:#222;color:white;border:1px solid #666}button{background:#b9a2ed;border:0}details{margin-top:36px;color:#bbb}a{color:#c1acf0}</style><h1>사이트 점검 중입니다.</h1><p><!-- MESSAGE --></p><details><summary>관리자 로그인</summary><form><input name="handle" autocomplete="username" placeholder="아이디" required><input name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required><button>로그인</button></form><p id="error"></p><a href="/auth/discord/start">디스코드로 로그인</a></details><script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/');}catch(e){document.querySelector('#error').textContent=e.message;}});</script></html>
