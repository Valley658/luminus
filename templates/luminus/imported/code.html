<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="{{ url_for('static', filename='logo/logo.webp') }}" type="image/webp">
    <title>Valley658/luminous: 루미너스 · 스텔라이브 비공식 팬 사이트</title>
    <meta name="description" content="루미너스 사이트의 소스 코드를 GitHub와 같은 모습으로 바로 둘러볼 수 있어요.">
    <link rel="canonical" href="https://pastellive.co.kr/code">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
    <style>
        /* GitHub(Primer) 다크/라이트 색상 체계를 그대로 따른다. 아이콘은 Primer Octicons(MIT). */
        :root {
            --bg: #0d1117; --bg-inset: #010409; --bg-muted: #151b23; --bg-subtle: #161b22; --bg-hover: #262c36;
            --border: #3d444d; --border-muted: #3d444db3; --fg: #f0f6fc; --fg-muted: #9198a1; --fg-subtle: #6e7681;
            --accent: #4493f8; --accent-muted: #388bfd66; --accent-subtle: #388bfd1a;
            --btn-bg: #212830; --btn-hover: #262c36; --btn-border: #3d444d;
            --green: #238636; --green-hover: #29903b; --green-fg: #ffffff;
            --dir: #9198a1; --hl-line: #bb800926; --hl-num: #f0f6fc;
            --overlay: #151b23; --shadow: 0 8px 24px #010409;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "D2Coding", monospace;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #ffffff; --bg-inset: #f6f8fa; --bg-muted: #f6f8fa; --bg-subtle: #f6f8fa; --bg-hover: #eff2f5;
                --border: #d1d9e0; --border-muted: #d1d9e0b3; --fg: #1f2328; --fg-muted: #59636e; --fg-subtle: #818b98;
                --accent: #0969da; --accent-muted: #54aeff66; --accent-subtle: #ddf4ff;
                --btn-bg: #f6f8fa; --btn-hover: #eff2f5; --btn-border: #d1d9e0;
                --green: #1f883d; --green-hover: #1c8139;
                --dir: #54aeff; --hl-line: #fff8c5; --hl-num: #1f2328;
                --overlay: #ffffff; --shadow: 0 8px 24px #424a531f;
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        svg.oi { fill: currentColor; vertical-align: text-bottom; flex: none; }
        button { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }

        /* 상단 헤더 */
        .gh-header { background: var(--bg-inset); border-bottom: 1px solid var(--border); padding: 16px 16px 0; }
        .gh-top { display: flex; align-items: center; gap: 12px; min-height: 32px; }
        .gh-logo { display: flex; border: 1px solid var(--border); border-radius: 6px; padding: 3px; }
        .gh-logo img { width: 24px; height: 24px; border-radius: 50%; display: block; }
        .gh-ctx { display: flex; align-items: center; gap: 4px; font-size: 14px; min-width: 0; }
        .gh-ctx a { color: var(--fg); padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
        .gh-ctx a:hover { background: var(--bg-hover); text-decoration: none; }
        .gh-ctx .repo { font-weight: 600; }
        .gh-ctx .sl { color: var(--fg-muted); }
        .gh-top .sp { flex: 1; }
        .gh-tabs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
        .gh-tabs::-webkit-scrollbar { display: none; }
        .gh-tabs .cnt { display: inline-block; min-width: 20px; padding: 0 6px; font-size: 12px; font-weight: 500; line-height: 18px; text-align: center;
            border-radius: 2em; background: var(--bg-hover); color: var(--fg); }
        #topbar { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: linear-gradient(90deg, #4493f8, #a371f7); z-index: 100;
            transition: width .3s ease, opacity .4s; opacity: 0; }
        #topbar.on { opacity: 1; }
        .gh-tabs a { display: flex; align-items: center; gap: 8px; padding: 0 8px; line-height: 30px; color: var(--fg); border-radius: 6px;
            position: relative; margin-bottom: 8px; white-space: nowrap; }
        .gh-tabs a:hover { background: var(--bg-hover); text-decoration: none; }
        .gh-tabs a svg { color: var(--fg-muted); }
        .gh-tabs a.on { font-weight: 600; }
        .gh-tabs a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 2px; background: #f78166; border-radius: 6px; }

        /* 버튼 */
        .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; font-size: 14px; font-weight: 500;
            background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--fg); cursor: pointer; white-space: nowrap; text-decoration: none; }
        .btn:hover { background: var(--btn-hover); text-decoration: none; }
        .btn svg { color: var(--fg-muted); }
        .btn-sm { height: 28px; padding: 0 8px; font-size: 12px; }
        .btn-icon { width: 32px; padding: 0; justify-content: center; }
        .btn-sm.btn-icon { width: 28px; }
        .btn-green { background: var(--green); border-color: rgba(240,246,252,.1); color: var(--green-fg); }
        .btn-green:hover { background: var(--green-hover); }
        .btn-green svg { color: var(--green-fg); }
        .btn-invisible { background: transparent; border-color: transparent; color: var(--fg-muted); }
        .btn-invisible:hover { background: var(--bg-hover); color: var(--fg); }
        .label { display: inline-block; padding: 0 7px; font-size: 12px; font-weight: 500; line-height: 18px; border: 1px solid var(--border);
            border-radius: 2em; color: var(--fg-muted); }

        /* 레이아웃 */
        .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 32px; }
        .repo-title { display: flex; align-items: center; gap: 8px; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border-muted); }
        .repo-title img { width: 24px; height: 24px; border-radius: 50%; }
        .repo-title strong { font-size: 20px; font-weight: 600; }
        .home { display: grid; grid-template-columns: minmax(0, 1fr) 296px; gap: 24px; }
        .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .bar .sp { flex: 1; }
        .meta-link { display: inline-flex; align-items: center; gap: 4px; color: var(--fg-muted); padding: 0 8px; height: 32px; border-radius: 6px; }
        .meta-link b { color: var(--fg); font-weight: 600; }
        .meta-link:hover { background: var(--bg-hover); text-decoration: none; color: var(--accent); }

        .box { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); overflow: clip; }
        .box + .box { margin-top: 16px; }
        .box-head { display: flex; align-items: center; gap: 8px; padding: 0 16px; min-height: 56px; background: var(--bg-muted);
            border-bottom: 1px solid var(--border); font-size: 14px; }

        /* 최근 커밋 줄 */
        .avatar { width: 24px; height: 24px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700;
            color: #fff; background: #8957e5; overflow: hidden; box-shadow: 0 0 0 1px var(--border-muted); }
        .avatar { position: relative; }
        .avatar i { font-style: normal; }
        .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .avatar.sm { width: 20px; height: 20px; font-size: 10px; }
        .cm-author { font-weight: 600; color: var(--fg); white-space: nowrap; }
        .cm-msg { color: var(--fg-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cm-msg:hover { color: var(--accent); }
        .cm-right { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--fg-muted); font-size: 12px; white-space: nowrap; }
        .cm-right .hash { font-family: var(--mono); color: var(--fg-muted); }
        .cm-right .hash:hover { color: var(--accent); }
        .cm-hist { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); font-size: 14px; font-weight: 600; padding: 0 8px; height: 28px; border-radius: 6px; }
        .cm-hist:hover { background: var(--bg-hover); text-decoration: none; }
        .cm-hist svg { color: var(--fg-muted); }

        /* 파일 목록 표 */
        .ftable { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .ftable td { padding: 0 16px; height: 40px; border-top: 1px solid var(--border); font-size: 14px; }
        .ftable tr:first-child td { border-top: 0; }
        .ftable tr:hover td { background: var(--bg-muted); }
        .ftable td.n { width: 33%; }
        .ftable td.n a { color: var(--fg); display: inline-flex; align-items: center; gap: 10px; max-width: 100%; }
        .ftable td.n a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ftable td.n a:hover span { color: var(--accent); text-decoration: underline; }
        .ftable td.n svg { color: var(--fg-muted); }
        .ftable td.n svg.d { color: var(--dir); }
        .ftable td.m { color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ftable td.m a { color: var(--fg-muted); }
        .ftable td.m a:hover { color: var(--accent); }
        .ftable td.t { width: 120px; text-align: right; color: var(--fg-muted); white-space: nowrap; }
        .ftable tr.up td { height: 40px; }
        .sk { display: inline-block; height: 12px; border-radius: 6px; background: var(--bg-hover); width: 60%; vertical-align: middle; }

        /* README 탭 */
        .rtabs { display: flex; gap: 8px; padding: 0 8px; border-bottom: 1px solid var(--border); min-height: 48px; align-items: center; }
        .rtabs a { display: inline-flex; align-items: center; gap: 8px; padding: 0 8px; line-height: 30px; color: var(--fg); border-radius: 6px; position: relative; cursor: pointer; }
        .rtabs a svg { color: var(--fg-muted); }
        .rtabs a:hover { background: var(--bg-hover); text-decoration: none; }
        .rtabs a.on { font-weight: 600; }
        .rtabs a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 2px; background: #f78166; border-radius: 6px; }
        .rtabs .sp { flex: 1; }

        /* About 사이드바 */
        .about h2 { font-size: 16px; font-weight: 600; margin: 0 0 16px; }
        .about p { margin: 0 0 16px; font-size: 16px; }
        .about .row { display: flex; align-items: center; gap: 8px; color: var(--fg-muted); margin: 8px 0; }
        .about .row a { color: var(--fg-muted); display: inline-flex; align-items: center; gap: 8px; }
        .about .row a:hover { color: var(--accent); text-decoration: none; }
        .about .row b { color: var(--fg-muted); font-weight: 600; }
        .about .lnk { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px; word-break: break-all; }
        .about section { border-top: 1px solid var(--border-muted); padding: 24px 0; }
        .about section:first-child { border-top: 0; padding-top: 0; }
        .langbar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; margin-bottom: 8px; gap: 2px; background: var(--bg-hover); }
        .langbar span { display: block; height: 100%; }
        .langs { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; }
        .langs li { display: inline-flex; align-items: center; gap: 6px; }
        .langs b { color: var(--fg); font-weight: 600; }
        .langs span.p { color: var(--fg-muted); }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

        /* 파일/폴더 화면: 왼쪽 트리 + 오른쪽 내용 */
        .split { display: flex; min-height: calc(100vh - 110px); }
        .tree { width: 320px; flex: none; border-right: 1px solid var(--border); position: sticky; top: 0; align-self: flex-start;
            height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
        .tree.hide { display: none; }
        .tree-top { padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px; }
        .tree-top .r1 { display: flex; align-items: center; gap: 8px; }
        .tree-top h2 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; }
        .tree-top .r2 { display: flex; gap: 8px; }
        .tree-top .r2 .btn { flex: none; }
        .tree-list { overflow: auto; padding: 0 8px 16px; flex: 1; }
        .ti { display: flex; align-items: center; gap: 6px; height: 32px; padding-right: 8px; border-radius: 6px; color: var(--fg); cursor: pointer;
            white-space: nowrap; position: relative; font-size: 14px; }
        .ti:hover { background: var(--bg-hover); text-decoration: none; }
        .ti.on { background: var(--bg-hover); font-weight: 600; }
        .ti.on::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 4px; border-radius: 6px; background: var(--accent); }
        .ti .ch { width: 16px; display: inline-flex; color: var(--fg-muted); transition: transform .1s; }
        .ti.open .ch { transform: rotate(90deg); }
        .ti svg.d { color: var(--dir); }
        .ti svg.f { color: var(--fg-muted); }
        .ti span { overflow: hidden; text-overflow: ellipsis; }
        .ti .gd { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border-muted); }
        .tkids { display: none; }
        .tkids.open { display: block; }
        .ti em { font-style: normal; font-weight: 600; color: var(--accent); }

        .pane { flex: 1; min-width: 0; padding: 16px 24px 32px; }
        .crumbs-row { display: flex; align-items: center; gap: 8px; min-height: 32px; margin-bottom: 16px; flex-wrap: wrap; }
        .crumbs { display: flex; align-items: center; flex-wrap: wrap; font-size: 16px; font-weight: 600; min-width: 0; }
        .crumbs a { color: var(--accent); padding: 0 1px; }
        .crumbs .s { color: var(--fg-muted); padding: 0 6px; font-weight: 400; }
        .crumbs .c { color: var(--fg); }
        .crumbs-row .sp { flex: 1; }

        .fhead { display: flex; align-items: center; gap: 8px; padding: 8px; background: var(--bg-muted); border-bottom: 1px solid var(--border); flex-wrap: wrap;
            position: sticky; top: 0; z-index: 6; }
        .fhead .info { color: var(--fg-muted); font-size: 12px; padding: 0 8px; }
        .fhead .sp { flex: 1; }
        .seg { display: inline-flex; background: var(--bg-hover); border-radius: 6px; padding: 0; border: 1px solid var(--border); }
        .seg button { border: 0; background: transparent; padding: 0 12px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--fg); }
        .seg button.on { background: var(--bg); box-shadow: 0 0 0 1px var(--border); font-weight: 600; }
        .grp { display: inline-flex; }
        .grp .btn { border-radius: 0; margin-left: -1px; }
        .grp .btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
        .grp .btn:last-child { border-radius: 0 6px 6px 0; }

        .code { overflow: auto; font-family: var(--mono); font-size: 12px; line-height: 20px; }
        .code table { border-collapse: collapse; tab-size: 4; min-width: 100%; }
        .code td { padding: 0; vertical-align: top; }
        .code td.ln { width: 1%; min-width: 50px; padding: 0 16px 0 10px; text-align: right; color: var(--fg-subtle); user-select: none; cursor: pointer; white-space: nowrap; }
        .code td.ln:hover { color: var(--fg); }
        .code td.lc { padding: 0 10px; white-space: pre; color: var(--fg); }
        .code tr.hl td { background: var(--hl-line); }
        .code tr.hl td.ln { color: var(--hl-num); }
        .code .hljs { background: transparent; padding: 0; color: inherit; }
        .code table { padding: 8px 0; }
        .note { padding: 48px 16px; text-align: center; color: var(--fg-muted); }
        .note svg { display: block; margin: 0 auto 12px; color: var(--fg-muted); }
        .note pre { text-align: left; display: inline-block; font: 12px var(--mono); background: var(--bg-muted); padding: 12px 16px; border-radius: 6px; }
        .imgv { padding: 32px; text-align: center; background: repeating-conic-gradient(var(--bg-muted) 0% 25%, var(--bg) 0% 50%) 50% / 20px 20px; }
        .imgv img { max-width: 100%; }

        /* 파일로 이동 */
        .goto { position: relative; }
        .goto .in { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 12px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--bg); color: var(--fg-muted); width: 240px; }
        .goto input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; outline: none; }
        .goto kbd { font: 11px var(--mono); border: 1px solid var(--border); border-radius: 6px; padding: 0 5px; color: var(--fg-muted); line-height: 18px; }
        .goto .in:focus-within { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
        .tree .goto .in { width: 100%; }
        .pop { position: absolute; z-index: 30; top: calc(100% + 4px); background: var(--overlay); border: 1px solid var(--border); border-radius: 12px;
            box-shadow: var(--shadow); padding: 8px; min-width: 100%; display: none; max-height: 420px; overflow: auto; }
        .pop.show { display: block; }
        .pop.r { right: 0; }
        .pop .it { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); cursor: pointer; font-size: 14px; white-space: nowrap; }
        .pop .it:hover, .pop .it.sel { background: var(--bg-hover); text-decoration: none; }
        .pop .it svg { color: var(--fg-muted); }
        .pop .it em { font-style: normal; font-weight: 700; color: var(--accent); }
        .pop .it .pth { color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; }
        .pop .empty { padding: 12px; color: var(--fg-muted); text-align: center; }
        .pop h3 { font-size: 14px; margin: 4px 8px 8px; display: flex; align-items: center; gap: 8px; }
        .pop .clone { display: flex; gap: 4px; margin: 0 8px 8px; }
        .pop .clone input { flex: 1; min-width: 260px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-inset); color: var(--fg); font: 12px var(--mono); padding: 0 8px; }
        .pop hr { border: 0; border-top: 1px solid var(--border-muted); margin: 8px 0; }
        .pop .hint { margin: 0 8px 8px; color: var(--fg-muted); font-size: 12px; }

        /* 마크다운 (GitHub 스타일) */
        .md { padding: 32px; font-size: 16px; line-height: 1.5; word-wrap: break-word; }
        .md > :first-child { margin-top: 0 !important; }
        .md h1, .md h2, .md h3, .md h4 { margin: 24px 0 16px; font-weight: 600; line-height: 1.25; }
        .md h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border-muted); }
        .md h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border-muted); }
        .md h3 { font-size: 1.25em; }
        .md p, .md ul, .md ol, .md blockquote, .md table, .md pre { margin: 0 0 16px; }
        .md ul, .md ol { padding-left: 2em; }
        .md li + li { margin-top: .25em; }
        .md code { font: 85% var(--mono); background: var(--bg-hover); padding: .2em .4em; border-radius: 6px; }
        .md pre { background: var(--bg-muted); padding: 16px; border-radius: 6px; overflow: auto; font-size: 85%; line-height: 1.45; }
        .md pre code { background: none; padding: 0; font-size: 100%; }
        .md blockquote { padding: 0 1em; color: var(--fg-muted); border-left: .25em solid var(--border); }
        .md table { border-collapse: collapse; display: block; overflow: auto; }
        .md th, .md td { padding: 6px 13px; border: 1px solid var(--border); }
        .md th { font-weight: 600; }
        .md tr:nth-child(2n) { background: var(--bg-muted); }
        .md img { max-width: 100%; }
        .md hr { height: .25em; background: var(--border); border: 0; margin: 24px 0; }

        /* 커밋 목록 */
        .page-h { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .page-h h1 { font-size: 24px; font-weight: 400; margin: 0; }
        .page-h .pth { color: var(--fg-muted); }
        .page-h .pth b { color: var(--fg); font-weight: 600; }
        .cgroup { position: relative; padding-left: 28px; padding-bottom: 16px; }
        .cgroup::before { content: ""; position: absolute; left: 7px; top: 24px; bottom: 0; width: 2px; background: var(--border-muted); }
        .cgroup:last-of-type::before { bottom: 16px; }
        .cgroup h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px -28px; font-size: 14px; font-weight: 400; color: var(--fg-muted); height: 24px; }
        .cgroup h3 svg { background: var(--bg); color: var(--fg-muted); }
        .crow { display: flex; gap: 16px; padding: 8px 16px; border-top: 1px solid var(--border); align-items: center; }
        .crow:first-child { border-top: 0; }
        .crow:hover { background: var(--bg-muted); }
        .crow .cl { flex: 1; min-width: 0; }
        .crow .ct { color: var(--fg); font-weight: 600; font-size: 16px; }

        // ---------- 커밋 상세(diff) ----------
        function parsePatch(patch) {

            patch.split('\n').forEach(function (l) {
                if (l.indexOf('diff --git ') === 0) { cur = { lines: [], binary: false }; secs.push(cur); return; }
                if (!cur) return;
                if (/^Binary files /.test(l)) { cur.binary = true; return; }
                if (!cur.started) { if (l.indexOf('@@') === 0) cur.started = true; else return; }
                cur.lines.push(l);

        function diffTable(lines, path) {

            lines.forEach(function (l) {
                if (l.indexOf('@@') === 0) {
                    var m = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)$/.exec(l); if (m) { o = +m[1]; n = +m[2]; }
                    rows.push('<tr class="hk"><td class="n"></td><td class="n"></td><td class="c">' + esc(l) + '</td></tr>'); return;
                }
                if (l === '' || l.charAt(0) === '\\') return;

                if (t === '+') rows.push('<tr class="ad"><td class="n"></td><td class="n">' + (n++) + '</td><td class="c">+' + html + '</td></tr>');
                else if (t === '-') rows.push('<tr class="dl"><td class="n">' + (o++) + '</td><td class="n"></td><td class="c">-' + html + '</td></tr>');
                else rows.push('<tr><td class="n">' + (o++) + '</td><td class="n">' + (n++) + '</td><td class="c"> ' + html + '</td></tr>');

        });
        function markQ(text, q) {
            var lt = text.toLowerCase(), lq = q.toLowerCase(), out = '', i = 0, j;
            while (lq && (j = lt.indexOf(lq, i)) >= 0) { out += esc(text.slice(i, j)) + '<mark>' + esc(text.slice(j, j + q.length)) + '</mark>'; i = j + q.length; }
            return out + esc(text.slice(i));
        }
        function renderSearch(q) {
            S.cur = null; S.view = 'search'; setTab('');
            document.title = q + ' 검색 · ' + OWNER + '/' + REPO;
            document.querySelector('#topSearch input').value = q;
            app.innerHTML = '<div class="wrap"><div class="page-h"><h1>코드 검색</h1></div>' +
                '<form class="gh-search sr-big" id="bigSearch"><label>' + ic('search') + '<input name="q" value="' + esc(q) + '" placeholder="찾을 코드를 입력하세요 (2글자 이상)" autocomplete="off"></label><button class="btn" type="submit">검색</button></form>' +
                '<div id="sres"><div class="box"><div class="note">검색 중…</div></div></div></div>';
            document.getElementById('bigSearch').addEventListener('submit', function (e) { e.preventDefault(); var v = this.q.value.trim(); if (v.length >= 2) navTo(qurl({ view: 'search', q: v })); });
            if (q.length < 2) { document.getElementById('sres').innerHTML = '<div class="box"><div class="blank">' + ic('search', '', 32) + '<h3>코드 내용으로 찾아보세요</h3><p>함수 이름, 문구, 설정값 무엇이든 돼요. 대소문자는 구분하지 않아요.</p></div></div>'; return; }
            api('/api/code/search?q=' + encodeURIComponent(q)).then(function (j) {
                if (S.view !== 'search') return;
                var files = j.files || [], el = document.getElementById('sres');
                if (!files.length) { el.innerHTML = '<div class="box"><div class="blank">' + ic('search', '', 32) + '<h3>"' + esc(q) + '"와 일치하는 코드가 없어요</h3><p>다른 낱말로 찾아보거나 파일 이름으로 찾아보세요. (단축키 t)</p></div></div>'; return; }
                el.innerHTML = '<p class="sr-sum">파일 <b>' + files.length + '</b>개에서 <b>' + j.matches.toLocaleString() + '</b>개 일치' + (j.truncated ? ' · 결과가 많아서 앞부분만 보여드려요' : '') +
                    ' · GitHub에 올라간 최신 코드 기준 (외부 라이브러리와 압축된 JS 제외)</p>' + files.map(function (f) {
                    var u = url(f.path);
                    return '<div class="box sr-file"><div class="sr-head">' + fileIcon(S.files[f.path] || { path: f.path }) + '<a href="' + u + '" data-go="' + esc(f.path) + '">' + markQ(f.path, q) + '</a><span class="n">' + f.total + '개 일치</span></div>' +
                        f.hits.map(function (h) { return '<a class="sline" href="' + u + '#L' + h.line + '" data-nav><span class="ln">' + h.line + '</span><code>' + markQ(h.text, q) + '</code></a>'; }).join('') +
                        (f.total > f.hits.length ? '<a class="sr-more" href="' + u + '" data-go="' + esc(f.path) + '">이 파일에서 ' + (f.total - f.hits.length) + '개 더 일치</a>' : '') + '</div>';
                }).join('');
            }).catch(function (e) { var el = document.getElementById('sres'); if (el) el.innerHTML = '<div class="box"><div class="note">' + esc(e.message) + '</div></div>'; });
        }

        // ---------- 기호(Symbols) ----------
        var SYM = {
            go: [[/^func\s+\(\s*\w*\s*\*?(\w+)[^)]*\)\s+(\w+)/, 'm', function (m) { return m[1] + '.' + m[2]; }], [/^func\s+(\w+)/, 'fn'],
                 [/^type\s+(\w+)\s+(?:struct|interface)/, 't'], [/^type\s+(\w+)/, 't'], [/^(?:const|var)\s+(\w+)/, 'v']],
            js: [[/^\s*(?:export\s+)?(?:default\s+)?(?:async\s+)?function\s*\*?\s*([\w$]+)/, 'fn'], [/^\s*(?:export\s+)?class\s+([\w$]+)/, 'c'],
                 [/^\s*(?:export\s+)?(?:const|let|var)\s+([\w$]+)\s*=\s*(?:async\s*)?(?:function\b|\([^)]*\)\s*=>|[\w$]+\s*=>)/, 'fn']],
            py: [[/^\s*(?:async\s+)?def\s+(\w+)/, 'fn'], [/^\s*class\s+(\w+)/, 'c']],
            rs: [[/^\s*(?:pub(?:\([^)]*\))?\s+)?(?:async\s+)?(?:const\s+)?fn\s+(\w+)/, 'fn'], [/^\s*(?:pub(?:\([^)]*\))?\s+)?(?:struct|enum|trait|type)\s+(\w+)/, 't'], [/^\s*impl(?:<[^>]*>)?\s+([\w:<>, ]+?)\s*\{/, 'c']],
            zig: [[/^\s*(?:pub\s+)?fn\s+(\w+)/, 'fn'], [/^\s*(?:pub\s+)?const\s+(\w+)\s*=\s*(?:struct|enum|union)/, 't']],
            ps1: [[/^\s*function\s+([\w-]+)/i, 'fn']],
            bat: [[/^:([\w-]+)/, 'fn']],
            css: [[/^([^\s@{}][^{]{0,80})\{/, 'v']],
            html: [[/<(h[1-3])[^>]*>([^<]{1,80})/i, 'h', function (m) { return m[2].trim(); }], [/\bid="([\w-]+)"/, 'v', function (m) { return '#' + m[1]; }]]
        };
        SYM.ts = SYM.js; SYM.mjs = SYM.js; SYM.cmd = SYM.bat; SYM.htm = SYM.html;
        var KIND = { fn: ['k-fn', '함수'], m: ['k-m', '메서드'], t: ['k-t', '타입'], c: ['k-c', '클래스'], h: ['k-h', '제목'], v: ['k-v', '값'] };
        function symbolsOf(text, p) {
            var e = ext(p), out = [], lines = text.split('\n'), fence = false;
            if (e === 'md' || e === 'markdown') {
                lines.forEach(function (l, i) { if (/^```/.test(l)) fence = !fence; var m = !fence && /^(#{1,6})\s+(.+?)\s*#*$/.exec(l); if (m) out.push({ n: m[2], k: 'h', l: i + 1, d: m[1].length - 1 }); });
                return out;
            }
            var rules = SYM[e]; if (!rules) return out;
            var html = e === 'html' || e === 'htm', inScript = false;
            for (var i = 0; i < lines.length && out.length < 2000; i++) {
                var l = lines[i];
                if (html) {
                    if (/<script\b/i.test(l)) inScript = true; if (/<\/script>/i.test(l)) inScript = false;
                    if (inScript) { var hit = null; SYM.js.some(function (r) { var m = r[0].exec(l); if (m) { hit = { n: m[1], k: r[1], l: i + 1 }; return true; } }); if (hit) { out.push(hit); continue; } }
                }
                for (var j = 0; j < rules.length; j++) {
                    var m = rules[j][0].exec(l);
                    if (m) { out.push({ n: rules[j][2] ? rules[j][2](m) : m[1].trim(), k: rules[j][1], l: i + 1 }); break; }
                }
            }
            return out;
        }
        function drawSymbols(el, syms, jump) {
            el.innerHTML = '<h3>' + ic('symbols') + '기호<span class="sp"></span><button class="btn btn-sm btn-icon btn-invisible" type="button" id="symX" title="닫기">' + ic('x') + '</button></h3>' +
                '<div class="f"><input type="text" placeholder="기호 찾기" aria-label="기호 찾기"></div><ul></ul>';
            var ul = el.querySelector('ul'), input = el.querySelector('input');
            var draw = function () {
                var q = input.value.trim().toLowerCase();
                var list = syms.filter(function (s) { return !q || s.n.toLowerCase().indexOf(q) >= 0; });
                ul.innerHTML = list.length ? list.map(function (s) {
                    var k = KIND[s.k] || KIND.v;
                    return '<li><a href="#L' + s.l + '" data-l="' + s.l + '" style="padding-left:' + (8 + (s.d || 0) * 12) + 'px" title="' + esc(k[1] + ' ' + s.n) + '"><span class="k ' + k[0] + '">' + k[1] + '</span><span class="nm">' + (q ? markQ(s.n, q) : esc(s.n)) + '</span><span class="l">' + s.l + '</span></a></li>';
                }).join('') : '<div class="empty">' + (syms.length ? '찾는 기호가 없어요.' : '이 파일에서 찾은 기호가 없어요.') + '</div>';
            };
            input.addEventListener('input', draw);
            ul.addEventListener('click', function (e) { var a = e.target.closest('a[data-l]'); if (a) { e.preventDefault(); jump(+a.dataset.l); } });
            el.querySelector('#symX').addEventListener('click', function () { S.toggleSym && S.toggleSym(); });
            draw();
        }
        try { S.symOpen = localStorage.getItem('codeSym') === '1'; } catch (e) {}

        // ---------- GitHub 스타 / 이슈 ----------
        function fmtN(n) { return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n); }
        function ghButtons() {
            var g = S.gh;
            var b = function (icon, label, href, n, cntHref, cls) {
                return '<span class="bgrp"><a class="btn btn-sm" href="' + href + '" target="_blank" rel="noopener">' + ic(icon, cls) + label + '</a>' +
                    (g ? '<a class="btn btn-sm" href="' + cntHref + '" target="_blank" rel="noopener">' + fmtN(n) + '</a>' : '') + '</span>';
            };
            return b('eye', '보기', GH + '/watchers', g ? g.watchers : 0, GH + '/watchers') + b('fork', '포크', GH + '/fork', g ? g.forks : 0, GH + '/forks') +
                b(g && g.stars ? 'starFill' : 'star', '스타', GH, g ? g.stars : 0, GH + '/stargazers', g && g.stars ? 'starf' : '');
        }
        function paintGitHub() {
            var g = S.gh, cnt = document.getElementById('issueCnt');
            if (g && cnt) { cnt.textContent = g.issues.length; cnt.style.display = g.issues.length ? '' : 'none'; }
            var btns = document.getElementById('ghBtns'); if (btns) btns.innerHTML = ghButtons();
            var ab = document.getElementById('ghAbout');
            if (ab && g) ab.innerHTML = '<div class="row"><a href="' + GH + '/stargazers" target="_blank" rel="noopener">' + ic('star') + '<b>' + g.stars + '</b> 스타</a></div>' +
                '<div class="row"><a href="' + GH + '/watchers" target="_blank" rel="noopener">' + ic('eye') + '<b>' + g.watchers + '</b> 보는 중</a></div>' +
                '<div class="row"><a href="' + GH + '/forks" target="_blank" rel="noopener">' + ic('fork') + '<b>' + g.forks + '</b> 포크</a></div>' +
                '<div class="row"><a href="/code?view=issues" data-nav>' + ic('issue') + '<b>' + g.issues.length + '</b> 열린 이슈</a></div>';
            var tp = document.getElementById('ghTopics');
            if (tp && g && g.topics && g.topics.length) tp.innerHTML = '<div class="topics">' + g.topics.map(function (t) { return '<a class="topic" href="https://github.com/topics/' + encodeURIComponent(t) + '" target="_blank" rel="noopener">' + esc(t) + '</a>'; }).join('') + '</div>';
        }
        function loadGitHub() {
            return api('/api/code/github').then(function (j) { S.gh = j.github; paintGitHub(); if (S.view === 'issues') renderIssues(); }).catch(function () { S.gh = null; S.ghFailed = true; if (S.view === 'issues') renderIssues(); });
        }
        function labelStyle(hex) {
            hex = /^[0-9a-f]{6}$/i.test(hex || '') ? hex : '8b949e';
            var r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
            var light = (r * 299 + g * 587 + b * 114) / 1000 > 150;
            return 'background:#' + hex + ';color:' + (light ? '#1f2328' : '#ffffff');
        }
        function renderIssues() {
            S.cur = null; S.view = 'issues'; setTab('issues');
            document.title = '이슈 · ' + OWNER + '/' + REPO;
            var g = S.gh, head = '<div class="page-h"><h1>이슈</h1><span class="sp" style="flex:1"></span><a class="btn btn-green" href="' + GH + '/issues/new" target="_blank" rel="noopener">' + ic('issue') + '새 이슈 (GitHub)</a></div>';
            if (!g) {
                app.innerHTML = '<div class="wrap">' + head + '<div class="box"><div class="blank">' + ic('issue', '', 32) + '<h3>' + (S.ghFailed ? 'GitHub 정보를 불러오지 못했어요' : '불러오는 중…') + '</h3>' +
                    (S.ghFailed ? '<p>잠시 후 다시 시도하거나 GitHub에서 바로 확인해 주세요.</p><a class="btn" href="' + GH + '/issues" target="_blank" rel="noopener">' + ic('ext') + 'GitHub 이슈 보기</a>' : '') + '</div></div></div>';
                return;
            }
            var rows = g.issues.map(function (it) {
                return '<div class="irow">' + ic('issue') + '<div style="flex:1;min-width:0"><a class="t" href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>' +
                    (it.labels || []).map(function (l, i) { return '<span class="ilabel" style="' + labelStyle((it.colors || [])[i]) + '">' + esc(l) + '</span>'; }).join('') +
                    '<div class="meta">#' + it.number + ' · ' + esc(it.author) + ' 님이 ' + relTime(it.created) + ' 열었어요</div></div>' +
                    (it.comments ? '<span class="cm">' + ic('comment') + it.comments + '</span>' : '') + '</div>';
            }).join('');
            app.innerHTML = '<div class="wrap">' + head + '<div class="box"><div class="box-head">' + ic('issue') + '<b>' + g.issues.length + '</b> 열림' +
                (g.open_prs ? '<span style="color:var(--fg-muted);margin-left:12px">' + ic('pr') + ' 열린 PR ' + g.open_prs + '개</span>' : '') +
                '<span class="cm-right"><a href="' + GH + '/issues?q=is%3Aissue+is%3Aclosed" target="_blank" rel="noopener">닫힌 이슈 보기</a></span></div>' +
                (rows || '<div class="blank">' + ic('issue', '', 32) + '<h3>열린 이슈가 없어요</h3><p>버그를 찾았거나 바라는 기능이 있으면 GitHub에 이슈로 남겨 주세요.</p><a class="btn" href="' + GH + '/issues/new" target="_blank" rel="noopener">' + ic('ext') + '이슈 만들기</a></div>') +
                '</div><p class="sr-sum" style="margin-top:12px;font-size:12px">GitHub에서 10분마다 새로 가져와요.</p></div>';
        }

        // ---------- 단축키 ----------
        var keys = document.getElementById('keys'), gPressed = 0;
        document.getElementById('kClose').addEventListener('click', function () { keys.classList.remove('show'); });
        keys.addEventListener('click', function (e) { if (e.target === keys) keys.classList.remove('show'); });
        document.addEventListener('keydown', function (e) {
            if (e.ctrlKey || e.metaKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
            if (e.key === 'Escape') { keys.classList.remove('show'); return; }
            if (e.key === '?') { keys.classList.add('show'); return; }
            if (e.key === 'b' && S.toggleBlame) { S.toggleBlame(); return; }
            if (e.key === 's' && S.toggleSym) { S.toggleSym(); return; }
            if (e.key === '/') { e.preventDefault(); var si = document.querySelector('#topSearch input'); si.focus(); si.select(); return; }
            if (e.key === '[') { var t = document.getElementById('tree'); if (t) { var cl = document.getElementById('treeClose'), op = document.getElementById('treeOpen'); if (t.classList.contains('hide') || getComputedStyle(t).display === 'none') { if (op) op.click(); } else if (cl) cl.click(); } return; }
            if (e.key === 'g') { gPressed = Date.now(); return; }
            if (Date.now() - gPressed < 1000) {
                if (e.key === 'c') { gPressed = 0; navTo('/code'); } else if (e.key === 'h') { gPressed = 0; navTo(hurl('')); } else if (e.key === 'i') { gPressed = 0; navTo('/code?view=issues'); }
            }
        });

        api('/api/code/tree').then(function (j) {
            S.commit = j.commit; S.head = j; S.root = build(j.files);
            loadHist(); loadGitHub();
            route();
        }).catch(function (err) {
            app.innerHTML = '<div class="wrap"><div class="box err"><div class="note">' + ic('repo', '', 32) + esc(err.message || '지금은 코드를 불러올 수 없어요.') +
                '<br><br><a class="btn" href="' + GH + '" target="_blank" rel="noopener">' + ic('ext') + 'GitHub에서 보기</a></div></div></div>';
        });
    })();
    </script>
</body>
</html>
