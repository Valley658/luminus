<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='logo/logo.webp') }}" type="image/webp">
    <title>비밀번호 찾기 - 루미너스</title>
    <link rel="canonical" href="https://pastellive.co.kr{{ request.path }}">
    <link rel="stylesheet" href="{{ versioned_static('vendor/fontawesome/css/all.min.css') }}">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif; line-height: 1.7; color: #e5e7eb;
            background: #0f0f0f; margin: 0; padding: 0 20px 60px; min-height: 100vh;
        }
        .policy-header {
            display: flex; align-items: center; justify-content: space-between;
            max-width: 420px; margin: 0 auto; padding: 24px 0; border-bottom: 1px solid #262626;
        }
        .policy-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .policy-brand img { width: 36px; height: 36px; border-radius: 50%; }
        .policy-brand span { font-size: 19px; font-weight: 900; letter-spacing: -0.5px; color: #38bdf8; }
        .back-home { color: #9ca3af; font-size: 13px; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .back-home:hover { color: #38bdf8; }

        .container {
            max-width: 420px; margin: 40px auto 0; background: #151515; border: 1px solid #262626;
            border-radius: 16px; padding: 36px 32px;
        }
        h1 { color: #fff; font-size: 1.3em; margin: 0 0 6px; }
        .subtitle { color: #8a8a8a; font-size: 0.85em; margin: 0 0 24px; }
        label { display: block; font-size: 13px; color: #bdbdbd; margin: 16px 0 6px; }
        input[type=email], input[type=password] {
            width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #333;
            background: #0f0f0f; color: #e5e7eb; font-size: 14px; outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            width: 100%; margin-top: 22px; padding: 12px; border: none; border-radius: 8px;
            background: #38bdf8; color: #06202b; font-weight: 700; font-size: 14px; cursor: pointer;
        }
        button:hover { background: #5cc9fb; }
        button:disabled { opacity: .55; cursor: default; }
        .msg { margin-top: 16px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: rgba(56,189,248,.12); color: #7dd3fc; border: 1px solid rgba(56,189,248,.3); }
        .msg.err { background: rgba(248,113,113,.12); color: #fca5a5; border: 1px solid rgba(248,113,113,.3); }
        .hint { font-size: 12px; color: #6b7280; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="policy-header">
        <a class="policy-brand" href="/">
            <img src="{{ url_for('static', filename='logo/logo.webp') }}" alt="루미너스 로고">
            <span>루미너스</span>
        </a>
        <a class="back-home" href="/"><i class="fas fa-arrow-left"></i> 홈으로</a>
    </div>

    <div class="container">
        <div id="requestView">
            <h1>비밀번호 찾기</h1>
            <p class="subtitle">가입할 때 등록한 이메일로 재설정 링크를 보내드려요.</p>
            <label for="emailInput">이메일</label>
            <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
            <button id="sendBtn" type="button">재설정 링크 보내기</button>
            <div id="requestMsg" class="msg"></div>
        </div>

        <div id="resetView" style="display:none;">
            <h1>새 비밀번호 설정</h1>
            <p class="subtitle">새로 쓸 비밀번호를 입력해주세요.</p>
            <label for="pw1">새 비밀번호</label>
            <input type="password" id="pw1" placeholder="8자 이상" autocomplete="new-password">
            <label for="pw2">새 비밀번호 확인</label>
            <input type="password" id="pw2" placeholder="한 번 더 입력" autocomplete="new-password">
            <button id="resetBtn" type="button">비밀번호 변경하기</button>
            <div id="resetMsg" class="msg"></div>
        </div>
    </div>

    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');

        function showMsg(el, text, ok) {
            el.textContent = text;
            el.className = 'msg show ' + (ok ? 'ok' : 'err');
        }

        if (token) {
            document.getElementById('requestView').style.display = 'none';
            var resetView = document.getElementById('resetView');
            resetView.style.display = 'block';
            var resetBtn = document.getElementById('resetBtn');
            var resetMsg = document.getElementById('resetMsg');
            resetBtn.addEventListener('click', function () {
                var pw1 = document.getElementById('pw1').value;
                var pw2 = document.getElementById('pw2').value;
                if (pw1.length < 8) {
                    showMsg(resetMsg, '비밀번호는 8자 이상이어야 해요.', false);
                    return;
                }
                if (pw1 !== pw2) {
                    showMsg(resetMsg, '두 비밀번호가 서로 달라요.', false);
                    return;
                }
                resetBtn.disabled = true;
                fetch('/api/account/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, password: pw1 })
                }).then(function (r) { return r.json().then(function (data) { return { status: r.status, data: data }; }); })
                    .then(function (res) {
                        resetBtn.disabled = false;
                        if (res.data.success) {
                            showMsg(resetMsg, res.data.message + ' 3초 후 메인으로 이동합니다...', true);
                            setTimeout(function () { window.location.href = '/'; }, 3000);
                        } else {
                            showMsg(resetMsg, res.data.message || '문제가 발생했어요.', false);
                        }
                    }).catch(function () {
                        resetBtn.disabled = false;
                        showMsg(resetMsg, '네트워크 오류가 발생했어요. 다시 시도해주세요.', false);
                    });
            });
        } else {
            var sendBtn = document.getElementById('sendBtn');
            var requestMsg = document.getElementById('requestMsg');
            sendBtn.addEventListener('click', function () {
                var email = document.getElementById('emailInput').value.trim();
                if (!email) {
                    showMsg(requestMsg, '이메일을 입력해주세요.', false);
                    return;
                }
                sendBtn.disabled = true;
                fetch('/api/account/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                }).then(function (r) { return r.json().then(function (data) { return { status: r.status, data: data }; }); })
                    .then(function (res) {
                        sendBtn.disabled = false;
                        showMsg(requestMsg, res.data.message || '문제가 발생했어요.', !!res.data.success);
                    }).catch(function () {
                        sendBtn.disabled = false;
                        showMsg(requestMsg, '네트워크 오류가 발생했어요. 다시 시도해주세요.', false);
                    });
            });
        }
    })();
    </script>
</body>
</html>
