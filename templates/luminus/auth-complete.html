<!doctype html><html lang="ko"><meta charset="utf-8"><link rel="icon" href="/favicon.ico?v=2" sizes="any"><meta name="viewport" content="width=device-width,initial-scale=1"><title>루미너스 · 디스코드 연동</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f0f0f;color:#eee;font:16px sans-serif}main{width:min(360px,85vw);padding:28px;background:#222;border-radius:16px}label,input,button{display:block;box-sizing:border-box;width:100%;margin-top:14px}input,button{padding:12px;border-radius:8px;border:1px solid #666;background:#151515;color:white}button{background:#c1acf0;color:#18121e;cursor:pointer}a{color:#c1acf0}p{line-height:1.6}#error{color:#ffb6b6}</style><main><h1>디스코드 연동</h1><p id="status">연동 상태를 확인하고 있습니다.</p><form hidden><label>아이디<input name="handle" required pattern="[a-zA-Z0-9_]{3,24}" minlength="3" maxlength="24" autocomplete="username"></label><label>비밀번호<input name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password" placeholder="10자 이상"></label><label>비밀번호 확인<input name="confirm" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><button>저장</button></form><p id="error" role="alert"></p><a href="/">홈으로</a></main><script src="/media/sweetalert2.all.min.js?v=11.26.25"></script><script>
const form=document.querySelector('form'),status=document.querySelector('#status'),error=document.querySelector('#error');
function home(){location.replace('/');}
async function load(){if(new URLSearchParams(location.search).has('auth_error')){status.textContent='디스코드 인증을 완료하지 못했습니다. 홈에서 다시 연동해 주세요.';return null;}const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error('연결을 확인해 주세요.');const d=await r.json();if(!d.user?.discordLinked){status.textContent='인증을 완료하지 못했습니다. 다시 로그인해 주세요.';return;}status.textContent=d.user.needsPassword?'연동되었습니다. 사용할 아이디와 비밀번호를 설정해 주세요.':'디스코드 연동이 완료되었습니다.';form.hidden=!d.user.needsPassword;form.elements.handle.value=d.user.handle.length<=25?d.user.handle.slice(1):'user_'+d.user.handle.slice(-12);return d.user;}
form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;error.textContent='';try{const r=await fetch('/api/auth/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();if(!r.ok)throw Error(d.error);form.reset();await load();home();}catch(e){error.textContent=e.message;}finally{button.disabled=false;}});load().then(async user=>{await Swal.fire({icon:user?'success':'error',titleText:user?'디스코드 로그인·연동 완료':'디스코드 인증 실패',text:status.textContent,confirmButtonText:'확인',timer:user?.needsPassword?undefined:1800,timerProgressBar:!user?.needsPassword,background:'#202020',color:'#eee',confirmButtonColor:'#a88bdf'});if(!user?.needsPassword)home();}).catch(e=>{error.textContent=e.message;Swal.fire({icon:'error',titleText:'서버 연결 오류',text:e.message,confirmButtonText:'확인',background:'#202020',color:'#eee'});});
</script></html>
