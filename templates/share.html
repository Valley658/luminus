<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - 루미너스</title>
    <link rel="icon" href="{{ url_for('static', filename='logo/logo.webp') }}" type="image/webp">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="루미너스">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:image" content="{{ image }}">
    <meta property="og:url" content="{{ share_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:image" content="{{ image }}">
    <meta name="description" content="{{ description }}">

    <meta http-equiv="refresh" content="1; url={{ redirect_target }}">
    <style>
        body {
            margin: 0; background: #0f0f0f; color: #fff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center;
        }
        .share-box { padding: 30px; }
        .share-box img { width: 64px; height: 64px; border-radius: 50%; margin-bottom: 20px; }
        .share-box p { color: #aaa; font-size: 15px; margin: 8px 0 0; }
        .spinner { border: 3px solid #333; border-top-color: #38bdf8; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
<script src="{{ versioned_static('js/thumbnails.js') }}"></script>
</head>
<body>
    <div class="share-box">
        <img src="{{ url_for('static', filename='logo/logo.webp') }}" alt="루미너스">
        <div class="spinner"></div>
        <p>이동 중입니다...</p>
    </div>
    <script>window.location.replace("{{ redirect_target }}");</script>
</body>
</html>
